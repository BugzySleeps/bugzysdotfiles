<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Icons everywhere: the Nerd Font symbols are every font's last resort, so the Quickshell shell's icons
     (and any app's) still show when its text font has none of its own (settings → look → font). -->
<fontconfig>
  <match target="pattern">
    <edit name="family" mode="append" binding="weak">
      <string>Symbols Nerd Font Mono</string>
    </edit>
  </match>
</fontconfig>
