# No app gets to run the audio graph faster than 1024 samples (~21 ms) a cycle. Native PipeWire apps
# (Swiftify, browsers via PipeWire, games) can ask for 256 or less, which this laptop can't keep up
# with: the audio crackles. pipewire-pulse.conf.d/50-min-latency.conf does the same for PulseAudio apps.
context.properties = {
    default.clock.min-quantum = 1024
}
