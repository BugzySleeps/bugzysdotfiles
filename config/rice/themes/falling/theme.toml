# Falling: an engraved Icarus tumbling through slate storm clouds
wallpaper = "wallpaper.png"
wofi_font = '"Liberation Serif", "DejaVu Serif", serif'

[colors]
bg0 = "#05090f"
bg1 = "#0c121a"
