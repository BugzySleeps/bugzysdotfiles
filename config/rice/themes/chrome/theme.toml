# Chrome: a glowing icy-white silhouette on pure black, periwinkle shadows
wallpaper = "wallpaper.png"
wofi_font = '"MesloLGS Nerd Font"'

[colors]
bg0 = "#000000"
bg1 = "#06070e"
bg2 = "#0e1020"
bg3 = "#1c1f33"
border = "#2c2f45"
accent = "#e6ecff"
accent2 = "#8a94bb"
fg = "#d5ddf4"
dim = "#5a6080"
bright = "#ffffff"

[hypr]
border_active = ["#ffffff", "#b4bcdd", "#6c7397"]
border_angle = 135
border_inactive = "#141626cc"
shadow = "#b4bcdd22"
rounding = 6

[term]
bg = "#030409"
fg = "#d5ddf4"
