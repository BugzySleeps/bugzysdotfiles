selection = "#2c2f45"
url = "#b4bcdd"
color0 = "#121424"
color1 = "#d48aa8"
color2 = "#8fc2b0"
color3 = "#dcc9a0"
color4 = "#8a9ae0"
color5 = "#b49ae6"
color6 = "#8ac4dc"
color7 = "#c4cbe4"
color8 = "#4a5070"
color9 = "#e6a6c0"
color10 = "#aad8c8"
color11 = "#ecdcb8"
color12 = "#a8b6f0"
color13 = "#cbb6f2"
color14 = "#a8dcf0"
color15 = "#f3f6fe"

[fastfetch]
logo1 = "#8a94bb"
logo2 = "#f3f6fe"
separator = "  "
rule = "──────────────────────────"
symbol = "circle"
