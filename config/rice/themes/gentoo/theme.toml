# Gentoo: stark black and white, glowing serif "gen2", striped swirl
wallpaper = "wallpaper.jpg"
wofi_font = '"Liberation Serif", "DejaVu Serif", serif'

[colors]
bg0 = "#000000"
bg1 = "#080808"
bg2 = "#121212"
bg3 = "#262626"
border = "#3a3a3a"
accent = "#ffffff"
accent2 = "#a8a8a8"
fg = "#e6e6e6"
dim = "#6a6a6a"
bright = "#ffffff"

[hypr]
border_active = ["#ffffff", "#000000", "#ffffff"]
border_angle = 45
border_inactive = "#1a1a1acc"
shadow = "#ffffff22"
rounding = 0

[term]
bg = "#000000"
fg = "#e6e6e6"
cursor = "#ffffff"
selection = "#5a5a5a"
url = "#cfcfcf"
color0 = "#141414"
color1 = "#b08a8a"
color2 = "#94a894"
color3 = "#b4ad92"
color4 = "#8e99ad"
color5 = "#a693a8"
color6 = "#93abab"
color7 = "#c8c8c8"
color8 = "#4a4a4a"
color9 = "#cdaaaa"
color10 = "#b2c6b2"
color11 = "#d2cbb0"
color12 = "#adb8cc"
color13 = "#c4b0c6"
color14 = "#b0c8c8"
color15 = "#ffffff"

[fastfetch]
logo1 = "#a8a8a8"
logo2 = "#ffffff"
separator = "  "
rule = "━━━━━━━━━━━━━━━━━━━━━━━━━━"
symbol = "square"
