# Hoppe: red-sun deep space over rust Martian ridges, teal planet glow
wallpaper = "wallpaper.png"
wofi_font = '"MesloLGS Nerd Font"'

[colors]
bg0 = "#070101"
bg1 = "#0e0403"
bg2 = "#170806"
bg3 = "#2a0e09"
border = "#57110a"
accent = "#e8351a"
accent2 = "#f59b6a"
fg = "#fce8dc"
dim = "#7a5a56"
bright = "#fdceaa"

[hypr]
border_active = ["#e8351a", "#9d180a", "#3f6b5c"]
