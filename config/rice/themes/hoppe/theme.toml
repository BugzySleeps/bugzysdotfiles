selection = "#9d180a"
url = "#6fa894"
color0 = "#1f0907"
color1 = "#d81e0c"
color2 = "#5c8a72"
color3 = "#d29a40"
color4 = "#5a6f8a"
color5 = "#a8566a"
color6 = "#5f9c8e"
color7 = "#eeb093"
color8 = "#6a504e"
color9 = "#ff4a2e"
color10 = "#7fb096"
color11 = "#f5b86a"
color12 = "#8197b4"
color13 = "#cf7f92"
color14 = "#85c0b1"
color15 = "#fce8dc"

[fastfetch]
logo1 = "#9d180a"
logo2 = "#f59b6a"
separator = " » "
rule = "·─·─·─·─·─·─·─·─·─·─·─·─·─"
symbol = "background"
