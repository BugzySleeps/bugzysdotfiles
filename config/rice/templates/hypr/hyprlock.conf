# GENERATED by `rice` ({{name}}) — edit ~/.config/rice/templates/hypr/hyprlock.conf instead
# Hyprlock, doubling as the greeter: tty1 autologins and Hyprland locks on start.
# Colours follow the rice theme; lockbox.png and dots/ are redrawn by `rice` too.
# Art: locklarry.png (locklarry.py), lockbox.png (lockart.py), dots/ (lockdots.py)

$font = MesloLGS Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = ease, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 6, ease
    animation = fadeOut, 1, 6, ease
    animation = inputFieldDots, 1, 2, ease
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    brightness = 0.75
}

# LARRY (white silhouette), with the clock on his body
image {
    monitor =
    path = ~/.config/hypr/locklarry.png
    size = 480
    rounding = 0
    border_size = 0
    position = 0, 200
    halign = center
    valign = center
}

# TIME, on Larry's body (the widest solid part of him)
label {
    monitor =
    text = <b>$TIME</b>
    color = rgb({{lock_clock|hex}})
    font_size = 30
    font_family = $font
    position = -25, 130
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb({{colors.fg|hex}})
    font_size = 16
    font_family = $font
    shadow_passes = 2
    shadow_size = 4
    position = 0, -65
    halign = center
    valign = center
}

# SQUIGGLY BOX behind the password field (size = its shorter side)
image {
    monitor =
    path = ~/.config/hypr/lockbox.png
    size = 66
    rounding = 0
    border_size = 0
    position = 0, -125
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 52
    outline_thickness = 0
    inner_color = rgba(00000000)
    font_color = rgb({{colors.fg|hex}})
    check_color = rgba(00000000)
    fail_color = rgba(00000000)
    font_family = $font
    fade_on_empty = false
    # "##" is a literal "#" (a single # starts a comment in hyprlang)
    placeholder_text = <span foreground="##{{colors.dim|hex}}">password</span>
    fail_text = <span foreground="##{{term.color1|hex}}">$PAMFAIL</span>
    check_text = <span foreground="##{{colors.accent2|hex}}">checking…</span>
    # one shape per dot, scrambled by position, when hyprlock has patches/hyprlock-shape-dots.patch
    # (shapes come from lockdots.py); plain dots otherwise. `rice` checks which.
    dots_text_format = {{lock_dots}}
    dots_size = 0.34
    dots_spacing = 0.35
    position = 0, -125
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text = $USER
    color = rgb({{colors.fg|hex}})
    font_size = 12
    font_family = $font
    shadow_passes = 2
    shadow_size = 3
    position = 0, -180
    halign = center
    valign = center
}
