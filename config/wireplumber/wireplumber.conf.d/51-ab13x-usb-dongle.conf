# AB13X USB-C to 3.5mm dongle: bigger ALSA buffers + extra headroom to avoid
# underruns, and never suspend (resume causes pops/clicks).
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.usb-Generic_AB13X*" }
      { node.name = "~alsa_input.usb-Generic_AB13X*" }
    ]
    actions = {
      update-props = {
        api.alsa.period-size         = 1024
        api.alsa.headroom            = 2048
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
